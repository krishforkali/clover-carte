name: Deploy Clover Carte

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Clover Carte
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js website
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clovercarte-build
          path: out/
          if-no-files-found: error

  deploy:
    name: Deploy to Clover Carte cPanel
    needs: build
    runs-on: ubuntu-latest

    # FTP_HOST, FTP_USERNAME and FTP_PASSWORD
    # are stored in the "production" environment
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: clovercarte-build
          path: out

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: out/
          server-dir: ./
